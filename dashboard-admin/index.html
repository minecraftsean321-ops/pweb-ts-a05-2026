<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="mystyle.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

</head>
<body>

    <div class="navbar">

    <div class="navbar-left">
    <h1>Dasbord Admin</h1>
    <p>Reset setiap hari agar penomoran antrian mulai dari awal.</p>
    </div>

    <div class="navbar-right">
    <i class="ri-search-line"></i>
    <i class="ri-notification-2-line"></i>
    <i class="ri-user-line"></i>
    </div>

    </div>

    <div class="container-utama">


    <div class="parent-container">
    <div class="container1" id="containerJenisAntrian">

        <h3>Jenis antrian</h3>

        <form class="input-1">  
            
            <div class="kode" id="inputKode">
            <p>Kode</p>
            <input type="text" placeholder="C">
            </div>

            <div class="nama-jenis">
            <p>Nama</p>
            <input type="text" placeholder="Contoh: Farmasi">

            <button type="button">Tambah</button>
            </div>

        </form>

        <ul class="list-antrian">
            <li>
                
            <div class="info-antrian">
                <div class="list-right">
                UMUM-1
                <p>(A)</p>
                </div>

                <div class="status-menunggu">
                0 Menunggu
                </div>
            </div>

                <div class="list-left">
                <button type="button">Nonaktifkan</button>
                <button type="button">Hapus</button>
                </div>

              
            </li>
           

        </ul>

    </div>

    <div class="container2">

        <h3>Terbitkan tiket</h3>

        <div class="input-2">

        <div class="antrian">

        <p>Jenis antrian</p>
        <select class="jenis-antrian" id="selectJenisTerbit">
            <option>Pilih Jenis Antrian</option>

        </select>
        </div>

        <div class="prioritas-form" id="selectPrioritas">
        <p>Prioritas</p>
        <select class="prioritas">
            <option value="Normal">Normal</option>

        </select>
        <button type="button" id="btnTerbitkan">Terbitkan</button>
        </div>

        </div>

        <div class="list-container">

            <ul class="list-jenis">


                <p>UMUM-1</p>
                <li>
                    
                    <div class="list-jenis-left">
                    A-001
                
                    <button type="button">Normal</button>
                    <button type="button">Dipanggil</button>
                    </div>

                    <div class="list-jenis-right">
                        <p>Selesai</p>
                    </div>

                </li>
            </ul>

        </div>

        </div>

    </div>

    </div>
    
    <script type="module" scrc="code.js"></script>
</body>
</html>
