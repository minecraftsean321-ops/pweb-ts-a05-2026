<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="mystyle.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

</head>
<body>

    <div class="navbar">

    <div class="navbar-left">
    <h1>Dasbord Admin</h1>
    <p>Reset setiap hari agar penomoran antrian mulai dari awal.</p>
    </div>

    <div class="navbar-right">

    <div class="navbar-user">

        <button type="button" id="btnResetAntrian" class="reset-antrian">Reset Antrian</button>

        <button type="button" id="profileButton" class="profile-button" aria-label="Buka panel profil" aria-controls="user-panel" aria-expanded="false">
            <i class="ri-user-line" aria-hidden="true"></i>
        </button>

        <div class="user-panel-hidden" id="user-panel" hidden>
            <div class="user-panel-heading">
                <i class="ri-user-smile-line" aria-hidden="true"></i>
                <div>
                    <span class="user-greeting">Selamat datang</span>
                    <strong id="userNameDisplay"></strong>
                </div>
            </div>
            <div class="user-role">
                <i class="ri-shield-user-line" aria-hidden="true"></i>
                <span>Role</span>
                <strong id="userRoleDisplay"></strong>
            </div>
            <button type="button" id="btnLogout" class="logout-button">
                <i class="ri-logout-box-r-line" aria-hidden="true"></i>
                <span>Logout</span>
            </button>
        </div>

    </div>

    </div>

    </div>

    <div class="container-utama">


    <div class="parent-container">

    <div class="container1" id="containerJenisAntrian">

        <div class="kotak-header">
        <h3>Jenis antrian</h3>
        </div>

        <form class="input-1">  
            <div class="kode" id="inputKode">
                <label for="inputKodeValue">Kode</label>
                <input id="inputKodeValue" type="text" placeholder="C">
            </div>

            <div class="nama-jenis" id="inputNama">
                <label for="inputNamaValue">Nama layanan</label>
                <input id="inputNamaValue" type="text" placeholder="Contoh: Farmasi">
            </div>

            <button type="button" id="btnTambah">Tambah</button>
        </form>

        <ul class="list-antrian" id="listJenisAntrian"></ul>

    </div>

    <div class="container2">

        <div class="kotak-header">
        <h3>Terbitkan tiket</h3>
        </div>

        <div class="input-2">

        <div class="antrian">

        <p>Jenis antrian</p>
        <select class="jenis-antrian" id="selectJenisTerbit">
            <option>Pilih Jenis Antrian</option>

        </select>
        </div>

        <div class="prioritas-form" id="selectPrioritas">
        <p>Prioritas</p>
        <select class="prioritas">
            <option value="Normal">Normal</option>
            <option value="Lansia">Lansia</option>
            <option value="Disabilitas">Disabilitas</option>
            <option value="VIP">VIP</option>

        </select>
        
        </div>

         <button type="button" id="btnTerbitkan">Terbitkan</button>

        </div>

        <div class="list-container">
            <div class="queue-list-heading">
                <h3>Antrian tiket</h3>
            </div>
            <div id="listTiketAntrian" class="ticket-groups"></div>
        </div>

        </div>

    </div>

    </div>
    
    <script type="module" src="code.js"></script>
</body>
</html>
