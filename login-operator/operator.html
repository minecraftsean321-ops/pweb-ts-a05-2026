<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Operator · Antrian Rumah Sakit</title>
    <link rel="stylesheet" href="login-operator.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="bar">
        <div class="merek">
            Panel Operator
            <small>Kelola Pemanggilan & Status Antrian</small>
        </div>
        <div class="operator-header-actions">
            <div class="operator-navbar-user">
                <button
                    type="button"
                    id="profileButton"
                    class="profile-button"
                    aria-label="Buka panel profil"
                    aria-controls="user-panel"
                    aria-expanded="false"
                >
                    <i class="ri-user-line" aria-hidden="true"></i>
                </button>
                <div class="operator-user-panel" id="user-panel" hidden>
                    <div class="user-panel-heading">
                        <i class="ri-user-smile-line" aria-hidden="true"></i>
                        <div>
                            <span class="user-greeting">Selamat datang</span>
                            <strong id="userNameDisplay"></strong>
                        </div>
                    </div>
                    <div class="user-role">
                        <i class="ri-shield-user-line" aria-hidden="true"></i>
                        <span>Role</span>
                        <strong id="userRoleDisplay"></strong>
                    </div>
                    <button type="button" id="btnLogout" class="logout-button">
                        <i class="ri-logout-box-r-line" aria-hidden="true"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="wadah" style="max-width: 1000px;">
        <div class="operator-grid">
            
            <div class="panel-panggilan">
                <h3 style="margin-top: 0; font-size: 1.2rem; color: var(--abu); text-transform: uppercase; letter-spacing: 0.05em;">Sedang Dipanggil</h3>
                
                <div style="margin: 24px 0;">
                    <div class="angka" id="lblNomorAktif">-</div>
                    <div style="margin-top: 12px;">
                        <p id="lblLayananAktif" style="margin: 0 0 6px; font-weight: 600; font-size: 1.1rem;">Belum ada antrian dipanggil</p>
                        <span id="lblPrioritasAktif" class="badge-prioritas" style="display: none;">-</span>
                    </div>
                </div>

                <div class="aksi" style="margin-top: 28px; display: flex; flex-direction: column; gap: 12px;">
                    <button type="button" id="btnPanggilBerikutnya" class="btn utama besar">Panggil Berikutnya</button>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <button type="button" id="btnLewati" class="btn btn-lewati-aksi">Lewati</button>
                        <button type="button" id="btnSelesai" class="btn btn-selesai-aksi">Selesai</button>
                    </div>
                </div>
            </div>

            <div class="daftar-menunggu-box">
                <h3 style="margin-top: 0; color: var(--hijau); font-size: 1.2rem;">Antrian Menunggu</h3>
                <p style="color: var(--abu); font-size: 0.85rem; margin-bottom: 16px;">Urutan prioritas: VIP → Disabilitas → Lansia → Normal</p>
                
                <ul id="listAntrianMenunggu" class="daftar-menunggu-list">
                    <li style="justify-content: center; color: var(--abu);">Memuat antrian...</li>
                </ul>
            </div>

        </div>
    </main>

    <script type="module" src="operator.js" defer></script>
</body>
</html>
